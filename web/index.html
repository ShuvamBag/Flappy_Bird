  <style>
    :root { color-scheme: only light; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #70c7f4; }
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999; overflow: hidden;
      display: grid; place-items: center;
      background: linear-gradient(180deg, #58b8f0 0%, #a4def9 68%, #dff5ff 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 550ms ease, visibility 550ms ease;
    }
    #loading-screen.is-hidden { opacity: 0; visibility: hidden; }
    .loader-sun {
      position: absolute; width: 210px; height: 210px; top: 12%; right: 12%;
      border-radius: 50%; background: #fff3b0; opacity: .72;
      box-shadow: 0 0 90px 28px rgba(255, 243, 176, .36);
    }
    .loader-cloud {
      position: absolute; width: 112px; height: 28px; border-radius: 30px;
      background: rgba(255,255,255,.62); filter: drop-shadow(0 8px 10px rgba(67,150,190,.1));
      animation: cloud-drift 8s ease-in-out infinite alternate;
    }
    .loader-cloud::before, .loader-cloud::after {
      content: ""; position: absolute; bottom: 8px; border-radius: 50%; background: inherit;
    }
    .loader-cloud::before { left: 20px; width: 42px; height: 42px; }
    .loader-cloud::after { left: 53px; width: 32px; height: 32px; }
    .cloud-one { top: 22%; left: 10%; }
    .cloud-two { top: 32%; right: 9%; transform: scale(.7); animation-delay: -3s; }
    .loader-card {
      position: relative; z-index: 1; width: min(340px, calc(100vw - 56px));
      padding: 34px 28px 30px; text-align: center; border-radius: 28px;
      background: rgba(255,255,255,.27); border: 1px solid rgba(255,255,255,.52);
      box-shadow: 0 24px 70px rgba(28,104,151,.17); backdrop-filter: blur(12px);
    }
    .loader-bird {
      display: inline-block; font-size: 64px; line-height: 1;
      filter: drop-shadow(0 8px 4px rgba(29,93,126,.2));
      animation: bird-flap 680ms ease-in-out infinite;
    }
    .loader-title { margin: 18px 0 5px; color: #17465e; font-size: 24px; font-weight: 900; letter-spacing: .04em; }
    .loader-caption { margin: 0; color: #32677d; font-size: 13px; font-weight: 600; }
    .loader-track { height: 7px; margin: 24px 3px 0; overflow: hidden; border-radius: 9px; background: rgba(23,70,94,.12); }
    .loader-track span {
      display: block; width: 38%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #fff17d, #ffb64b); animation: loading-sweep 1.35s ease-in-out infinite;
    }
    .loader-ground { position: absolute; inset: auto 0 0; height: 15%; background: linear-gradient(#77ca54, #379446); }
    .loader-ground::before { content: ""; position: absolute; inset: -12px 0 auto; height: 22px; background: radial-gradient(ellipse at 12px 15px, #84d35b 0 12px, transparent 13px) repeat-x; background-size: 28px 22px; }
    @keyframes bird-flap { 0%,100% { transform: translateY(4px) rotate(-7deg); } 50% { transform: translateY(-10px) rotate(7deg); } }
    @keyframes loading-sweep { from { transform: translateX(-110%); } to { transform: translateX(290%); } }
    @keyframes cloud-drift { from { translate: -8px 0; } to { translate: 12px 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 3s !important; transition-duration: 1ms !important; } }
  </style>

</head>
<body>
  <div id="loading-screen" role="status" aria-label="Loading Flappy Bird">
    <div class="loader-sun" aria-hidden="true"></div>
    <div class="loader-cloud cloud-one" aria-hidden="true"></div>
    <div class="loader-cloud cloud-two" aria-hidden="true"></div>
    <main class="loader-card">
      <div class="loader-bird" aria-hidden="true">🐦</div>
      <h1 class="loader-title">FLAPPY BIRD</h1>
      <p class="loader-caption">Warming up those wings…</p>
      <div class="loader-track" aria-hidden="true"><span></span></div>
    </main>
    <div class="loader-ground" aria-hidden="true"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var screen = document.getElementById('loading-screen');
      if (!screen) return;
      screen.classList.add('is-hidden');
      window.setTimeout(function () { screen.remove(); }, 600);
    }, { once: true });
  </script>
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
